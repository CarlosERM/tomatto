[project]
name = "tomatto"
version = "1.0.0"
description = "Simplified Cold-Turkey-style website blocker: two REST APIs + MV3 browser extension, built as an LLM-prompted integration-testing exercise"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "idna>=3.7",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.24",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "integration: cross-service integration tests (Manager API <-> Sync API)",
]
